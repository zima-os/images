name: Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      actions: write
      packages: write
      contents: write

    steps:
      -
        name: Get latest upstream release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          upstream="IceWhaleTech/ZimaOS"

          latest_tag=$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$upstream/releases?per_page=100" \
              --jq '[.[] | select(.draft == false)][0].tag_name // empty'
          )

          if [ -z "$latest_tag" ]; then
            echo "Release not found!" >&2
            exit 1
          fi

          latest_tag="${latest_tag#v}"

          latest_version="${latest_tag%%-*}"
          major="${latest_version%%.*}"
          minor="${latest_version#*.}"
          minor="${minor%%.*}"

          echo "Found release: \"$latest_tag\""

          echo "latest_tag=$latest_tag" >> "$GITHUB_ENV"
          echo "latest_minor=$major.$minor" >> "$GITHUB_ENV"

      -
        name: Check if release exists
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          if gh release view "v${latest_tag}" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then
            echo "Release v${latest_tag} already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release v${latest_tag} does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      -
        name: Install build dependencies
        if: steps.release.outputs.exists == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bzip2 \
            cpio \
            gzip \
            lz4 \
            lzop \
            python3 \
            xorriso \
            xz-utils \
            zstd

      -
        name: Download upstream release
        if: steps.release.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          upstream="IceWhaleTech/ZimaOS"

          release=$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$upstream/releases/tags/$latest_tag"
          )

          iso_name=$(
            jq -r '
              .assets[]
              | select(.name | endswith("_installer.iso"))
              | .name
            ' <<< "$release" | head -n 1
          )

          if [ -z "$iso_name" ]; then
            echo "Installer ISO was not found in upstream release $latest_tag." >&2
            exit 1
          fi

          iso_url=$(
            jq -r --arg name "$iso_name" '
              .assets[]
              | select(.name == $name)
              | .browser_download_url
            ' <<< "$release"
          )

          release_title=$(jq -r '.name // empty' <<< "$release")
          release_body=$(jq -r '.body // empty' <<< "$release")

          if [ -z "$iso_url" ]; then
            echo "Failed to determine the installer ISO URL." >&2
            exit 1
          fi

          [ -n "$release_title" ] || release_title="ZimaOS $latest_tag"

          output_name="${iso_name%_installer.iso}.iso"

          printf '%s\n' "$release_body" > release-notes.md

          echo "release_title=$release_title" >> "$GITHUB_ENV"
          echo "iso_name=$iso_name" >> "$GITHUB_ENV"
          echo "output_name=$output_name" >> "$GITHUB_ENV"

          echo "Downloading $iso_name..."

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --output "$iso_name" \
            "$iso_url"

          test -s "$iso_name"

      -
        name: Create unattended installer ISO
        if: steps.release.outputs.exists == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail

          work="$RUNNER_TEMP/zima-autoinstall"
          original_iso="$GITHUB_WORKSPACE/$iso_name"
          output_iso="$GITHUB_WORKSPACE/$output_name"

          rm -rf "$work"

          mkdir -p \
            "$work/initramfs" \
            "$work/verify/initramfs"

          echo "Extracting initramfs and GRUB configuration..."

          xorriso \
            -osirrox on \
            -indev "$original_iso" \
            -extract /install.amd/initrd "$work/initrd" \
            -extract /boot/grub/grub.cfg "$work/grub.cfg"

          test -s "$work/initrd"
          test -s "$work/grub.cfg"

          echo "Unpacking initramfs..."

          split_initramfs() {
            python3 - "$@" <<'PYTHON'
          import pathlib
          import sys

          data = pathlib.Path(sys.argv[1]).read_bytes()
          offset = 0
          archives = []

          # Locate the main archive without changing any early CPIO archives.
          while True:
              while offset < len(data) and data[offset] == 0:
                  offset += 1
              if data[offset:offset + 6] not in (b"070701", b"070702"):
                  break
              start = offset
              while True:
                  header = data[offset:offset + 110]
                  if len(header) != 110 or header[:6] not in (b"070701", b"070702"):
                      sys.exit("Invalid or truncated initramfs CPIO header.")
                  try:
                      file_size = int(header[54:62], 16)
                      name_size = int(header[94:102], 16)
                  except ValueError:
                      sys.exit("Invalid initramfs CPIO size field.")
                  name_end = offset + 110 + name_size
                  if name_size < 1 or name_end > len(data):
                      sys.exit("Invalid or truncated initramfs CPIO filename.")
                  name = data[offset + 110:name_end]
                  if not name.endswith(b"\0"):
                      sys.exit("Invalid initramfs CPIO filename terminator.")
                  offset = (name_end + 3) & ~3
                  offset = (offset + file_size + 3) & ~3
                  if offset > len(data):
                      sys.exit("Truncated initramfs CPIO file data.")
                  if name.rstrip(b"\0") == b"TRAILER!!!":
                      break
              archives.append(start)

          if offset == len(data) and archives:
              offset = archives[-1]
              compression = "cpio"
          else:
              formats = (
                  (b"\x1f\x8b", "gzip"),
                  (b"\xfd7zXZ\x00", "xz"),
                  (b"\x28\xb5\x2f\xfd", "zstd"),
                  (b"BZh", "bzip2"),
                  (b"\x02\x21\x4c\x18", "lz4"),
                  (b"\x04\x22\x4d\x18", "lz4-frame"),
                  (b"\x89LZO\x00\x0d\x0a\x1a\x0a", "lzo"),
                  (b"\x5d\x00", "lzma"),
                  (b"\x6d\x00", "lzma"),
              )
              compression = next(
                  (kind for magic, kind in formats if data.startswith(magic, offset)),
                  None,
              )
              if compression is None:
                  sys.exit("Unsupported initramfs format: " + data[offset:offset + 16].hex())

          pathlib.Path(sys.argv[2]).write_bytes(data[:offset])
          pathlib.Path(sys.argv[3]).write_bytes(data[offset:])
          print(compression)
          PYTHON
          }

          decompress_initramfs() {
            case "$1" in
              gzip) gzip -dc ;;
              xz) xz -dc ;;
              zstd) zstd -q -dc ;;
              bzip2) bzip2 -dc ;;
              lz4|lz4-frame) lz4 -dc ;;
              lzo) lzop -dc ;;
              lzma) xz --format=lzma -dc ;;
              cpio) cat ;;
              *) echo "Unsupported initramfs compression: $1" >&2; return 1 ;;
            esac < "$2"
          }

          initrd_format=$(
            split_initramfs \
              "$work/initrd" \
              "$work/initrd-prefix" \
              "$work/initrd-main"
          )

          echo "Detected initramfs compression: $initrd_format"

          decompress_initramfs \
            "$initrd_format" \
            "$work/initrd-main" > "$work/initrd-main.cpio"

          (
            cd "$work/initramfs"

            sudo cpio \
              -idm \
              --quiet \
              --no-absolute-filenames < "$work/initrd-main.cpio"
          )

          sudo chown -R \
            "$(id -u):$(id -g)" \
            "$work/initramfs"

          if [ ! -e "$work/initramfs/usr/bin/whiptail" ]; then
            echo "The expected whiptail executable was not found." >&2
            exit 1
          fi

          if [ ! -e "$work/initramfs/usr/bin/installer" ]; then
            echo "The expected ZimaOS installer was not found." >&2
            exit 1
          fi

          echo "Installing automatic prompt handler..."

          mv \
            "$work/initramfs/usr/bin/whiptail" \
            "$work/initramfs/usr/bin/whiptail.real"

          cat > "$work/initramfs/usr/bin/whiptail" <<'EOF'
          #!/bin/sh

          arguments="$*"

          case "$arguments" in
            *"--yesno"*)
              exit 0
              ;;

            *"QUICK INSTALL MENU"*)
              for argument in "$@"; do
                case "$argument" in
                  /dev/sd*|/dev/mmcblk*|/dev/nvme*)
                    if [ -b "$argument" ]; then
                      printf '%s\n' "$argument" >&2
                      exit 0
                    fi
                    ;;
                esac
              done

              echo "No installation target was found." >&2
              exit 1
              ;;

            *"Install Demo Data"*)
              printf '%s\n' "2" >&2
              exit 0
              ;;

            *"MAIN MENU"*)
              printf '%s\n' "1" >&2
              exit 0
              ;;

            *"Installation done"*|*"You may now remove the install media and reboot."*)
              sync
              reboot -f
              exit 0
              ;;

            *)
              exec /usr/bin/whiptail.real "$@"
              ;;
          esac
          EOF

          chmod 755 "$work/initramfs/usr/bin/whiptail"

          echo "Configuring immediate GRUB startup..."

          {
            printf '%s\n' \
              'set default=0' \
              'set timeout=0'

            cat "$work/grub.cfg"
          } > "$work/grub-autoinstall.cfg"

          echo "Repacking initramfs..."

          sudo bash -c '
            set -Eeuo pipefail

            source_dir="$1"
            destination="$2"

            case "$3" in
              gzip) compressor=(gzip -9n) ;;
              xz) compressor=(xz --check=crc32 -6 -c) ;;
              zstd) compressor=(zstd -q -3 -c) ;;
              bzip2) compressor=(bzip2 -9 -c) ;;
              lz4) compressor=(lz4 -l -9 -c) ;;
              lz4-frame) compressor=(lz4 -9 -c) ;;
              lzo) compressor=(lzop -9 -c) ;;
              lzma) compressor=(xz --format=lzma -6 -c) ;;
              cpio) compressor=(cat) ;;
              *) echo "Unsupported initramfs compression: $3" >&2; exit 1 ;;
            esac

            cd "$source_dir"

            find . -print0 |
              LC_ALL=C sort -z |
              cpio \
                --null \
                --create \
                --format=newc \
                --owner=0:0 \
                --quiet |
              "${compressor[@]}" > "$destination"
          ' _ \
            "$work/initramfs" \
            "$work/initrd-autoinstall-main" \
            "$initrd_format"

          sudo chown \
            "$(id -u):$(id -g)" \
            "$work/initrd-autoinstall-main"

          decompress_initramfs \
            "$initrd_format" \
            "$work/initrd-autoinstall-main" > /dev/null

          cat \
            "$work/initrd-prefix" \
            "$work/initrd-autoinstall-main" > "$work/initrd-autoinstall"

          test -s "$work/initrd-autoinstall"

          echo "Rebuilding ISO..."

          xorriso \
            -indev "$original_iso" \
            -outdev "$output_iso" \
            -boot_image any replay \
            -map "$work/initrd-autoinstall" /install.amd/initrd \
            -map "$work/grub-autoinstall.cfg" /boot/grub/grub.cfg \
            -commit

          test -s "$output_iso"

          echo "Verifying patched ISO..."

          xorriso \
            -osirrox on \
            -indev "$output_iso" \
            -extract /install.amd/initrd "$work/verify/initrd" \
            -extract /boot/grub/grub.cfg "$work/verify/grub.cfg"

          verify_format=$(
            split_initramfs \
              "$work/verify/initrd" \
              "$work/verify/initrd-prefix" \
              "$work/verify/initrd-main"
          )

          test "$verify_format" = "$initrd_format"
          cmp -s "$work/initrd-prefix" "$work/verify/initrd-prefix"
          cmp -s "$work/initrd-autoinstall-main" "$work/verify/initrd-main"

          grep -Fxq \
            'set default=0' \
            "$work/verify/grub.cfg"

          grep -Fxq \
            'set timeout=0' \
            "$work/verify/grub.cfg"

          echo "Verifying automatic prompt handler..."

          decompress_initramfs \
            "$verify_format" \
            "$work/verify/initrd-main" |
            (
              cd "$work/verify/initramfs"

              sudo cpio \
                -idm \
                --quiet \
                --no-absolute-filenames
            )

          grep -Fq \
            'QUICK INSTALL MENU' \
            "$work/verify/initramfs/usr/bin/whiptail"

          grep -Fq \
            '/dev/sd*|/dev/mmcblk*|/dev/nvme*' \
            "$work/verify/initramfs/usr/bin/whiptail"

          grep -Fq \
            'No installation target was found.' \
            "$work/verify/initramfs/usr/bin/whiptail"

          grep -Fq \
            'reboot -f' \
            "$work/verify/initramfs/usr/bin/whiptail"

          if grep -Fq \
            '*"--gauge"*)' \
            "$work/verify/initramfs/usr/bin/whiptail"; then
            echo "The automatic prompt handler still intercepts progress gauges." >&2
            exit 1
          fi

          test -e \
            "$work/verify/initramfs/usr/bin/whiptail.real"

          echo
          echo "ISO verification completed successfully."

          printf 'Original ISO: '
          du -h "$original_iso" | cut -f1

          printf 'Patched ISO:  '
          du -h "$output_iso" | cut -f1

          rm -f "$original_iso"

      -
        name: Publish release
        if: steps.release.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          test -s "$output_name"
          test -s release-notes.md

          gh release create "v${latest_tag}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$release_title" \
            --notes-file release-notes.md \
            "$output_name"

      -
        name: Send mail
        if: steps.release.outputs.exists == 'false' && success()
        uses: action-pack/send-mail@v1
        with:
          to: ${{ secrets.MAILTO }}
          from: GitHub Actions <${{ secrets.MAILTO }}>
          connection_url: ${{ secrets.MAIL_CONNECTION }}
          subject: ZimaOS ${{ env.latest_tag }} was released
          body: |
            ZimaOS ${{ env.latest_tag }} was released and its automatic installer was published.

            See https://github.com/${{ github.repository }}/releases/tag/v${{ env.latest_tag }}
